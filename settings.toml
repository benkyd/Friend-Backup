listen = 9090
encryption = "RSA512"

[schedule]
cron = "0 3 * * *"             # 5-field, UTC

[backup]
sources    = ["/backup/documents", "/backup/projects", "/backup/pictures"]
exclude    = ["**/target", "**/node_modules", "**/.cache"]
encrypt_to  = "age1xxx..."
zstd_level = 3

[friends]

[friends.one]
id = "iroh_id"

[friends.two]
id = "iroh_id"

[storage]
path = "/pathtostoreothers"
max = "1TB"
default_grant = 0

[storage.grants]
one="100GB"
two="200GB"

